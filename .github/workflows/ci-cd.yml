name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-node:
    permissions:
      contents: read
    uses: s3ntin3l8/.github/.github/workflows/ci-node.yml@main
    with:
      node-version: "26"
      test-script: "test:coverage"
      strict-checks: true
      # Only the files this push touched can have introduced a secret. The
      # baseline is keyed by filename and line number, so an unchanged file
      # keeps its entry and the scan stays consistent.
      detect-secrets-scope: "changed"
    secrets: inherit # pragma: allowlist secret

  build-docker:
    needs: [test-node]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: s3ntin3l8/.github/.github/workflows/docker-publish.yml@main
    with:
      image-name: "s3ntin3l8/${{ github.event.repository.name }}"
      push-edge: ${{ github.event_name == 'push' }}
    secrets: inherit # pragma: allowlist secret